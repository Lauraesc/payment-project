# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
# Disabling the swagger-ui
springdoc.swagger-ui.enabled=true
server.port=8083
spring.application.name=businessdomain-product

#properties for connecting to Eureka
#interpolation way (tries to read EUREKA_SERVER, if not found, uses default value)
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}
#for indicate that this service should be registered as an available service
eureka.client.register-with-eureka=true
#for checking the health of the service
eureka.client.healthcheck.enabled=true
#it lets the client know that they should download the list of services registered in Eureka
eureka.client.fetch-registry=true

spring.cloud.config.enabled=false
#it's going to expose all the endpoints available with Actuator of this microservice
management.endpoints.web.exposure.include=*
